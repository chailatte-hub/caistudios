<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cai studios</title>
<meta name="description" content="cai studios. Follow along on Instagram or book a session.">
<meta name="theme-color" content="#31337f">
<meta property="og:title" content="cai studios">
<meta property="og:description" content="Follow along on Instagram or book a session.">
<meta property="og:image" content="https://cai-studios.com/assets/og.jpg">
<meta property="og:url" content="https://cai-studios.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" as="image" href="assets/cover-1600.jpg" imagesrcset="assets/cover-1600.jpg 1600w, assets/cover.jpg 2489w" imagesizes="max(100vw, 178.3vh)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
<style>
  :root { --ratio: 1.783; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #31337f; overflow: hidden; }

  /* The artwork always covers the screen. Links are placed in the
     artwork's own coordinates, so they stay just under the logo at any size. */
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: max(100vw, calc(100vh * var(--ratio)));
    height: max(100vh, calc(100vw / var(--ratio)));
    width: max(100vw, calc(100dvh * var(--ratio)));
    height: max(100dvh, calc(100vw / var(--ratio)));
    transform: translate(-50%, -50%);
  }
  .stage img { width: 100%; height: 100%; display: block; }

  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  nav {
    position: absolute; left: 50%; top: 72%;
    transform: translateX(-50%);
    display: flex; gap: 14px;
  }
  nav a {
    font-family: "Fraunces", Georgia, serif;
    font-size: 17px; letter-spacing: .02em;
    color: #fff; text-decoration: none; white-space: nowrap;
    padding: 11px 24px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.55);
    background: rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background .25s, color .25s, border-color .25s;
  }
  nav a:hover, nav a:focus-visible {
    background: #fff; color: #31337f; border-color: #fff; outline: none;
  }
  @media (max-width: 420px) {
    nav { gap: 10px; }
    nav a { font-size: 15px; padding: 10px 18px; }
  }
  @media (prefers-reduced-motion: reduce) { nav a { transition: none; } }
</style>
</head>
<body>
<main class="stage">
  <img src="assets/cover-1600.jpg"
       srcset="assets/cover-1600.jpg 1600w, assets/cover.jpg 2489w"
       sizes="max(100vw, 178.3vh)"
       alt="cai studios">
  <h1>cai studios</h1>
  <nav aria-label="Links">
    <a href="https://tinyurl.com/caistudios" target="_blank" rel="noopener">Book a session</a>
    <a href="https://www.instagram.com/cai__studios/" target="_blank" rel="noopener">Instagram</a>
  </nav>
</main>
</body>
</html>
